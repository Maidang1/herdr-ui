name: Release

# Pushing vX.Y.Z builds macOS, Windows and Linux in parallel, then publishes all
# platforms in one GitHub release. The tag must match mygo.json. Manual runs
# only build artifacts, including when dispatched on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Keep test Unix socket paths below macOS sockaddr_un limits.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against mygo.json
        id: version
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # libghostty-vt, which mygo downloads by checksum; go.sum pins mygo.
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/mygo/natives
          key: mygo-natives-${{ hashFiles('go.sum') }}

      - name: Test
        run: make test

      - name: Build the universal app and disk image
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is required to publish signed updates"
            exit 1
          fi
          make dmg
          test -s dist/darwin-universal/update-darwin-universal.json
          compgen -G 'dist/darwin-universal/*.tar.gz' > /dev/null

      - name: Name the disk image
        id: dmg
        run: |
          name="Hergo-${{ steps.version.outputs.version }}-macos-universal.dmg"
          mv "dist/darwin-universal/Hergo ${{ steps.version.outputs.version }}.dmg" "dist/$name"
          shasum -a 256 "dist/$name" | sed 's| dist/| |' > "dist/$name.sha256"
          mkdir release-assets
          shopt -s nullglob
          cp "dist/$name" "dist/$name.sha256" dist/darwin-universal/update-*.json dist/darwin-universal/*.tar.gz dist/darwin-universal/*.delta release-assets/
          # Older architecture-specific builds use these feeds. The universal
          # archive supports both CPUs; keep its URLs and signatures unchanged.
          cp release-assets/update-darwin-universal.json release-assets/update-darwin-arm64.json
          cp release-assets/update-darwin-universal.json release-assets/update-darwin-amd64.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          path: release-assets/*

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json
        id: version
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match mygo.json version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Runtime tests
        run: python scripts/go.py test -timeout 3m ./...
      - name: Vet
        run: python scripts/go.py vet ./...
      - name: Build native executable
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python scripts/go.py build -trimpath -o artifacts/herdr-ui.exe ./cmd/herdr-ui
      - name: Install checksum-pinned official Herdr runtime
        run: python scripts/install-herdr-windows.py --destination "$env:RUNNER_TEMP/herdr-0.9.5"
      - name: Real named-pipe daemon and semantic surface integration
        run: python scripts/go.py test -tags integration ./integration -run '^TestWindowsNativeSurface$' -count=1 -v -timeout 3m
      # The pinned mygo CLI has no -skip-installer flag. Its supported build
      # command downloads NSIS when needed and creates the installer on Windows.
      - name: Package native Windows application and signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MYGO_UPDATER_PRIVATE_KEY)) {
            throw 'MYGO_UPDATER_PRIVATE_KEY is required to publish signed updates'
          }
          python scripts/go.py run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Item dist/windows-amd64/update-windows-amd64.json
          if ($manifest.Length -eq 0) { throw 'Windows update manifest is empty' }
      - name: Create portable application ZIP
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $portable = Join-Path $env:RUNNER_TEMP 'herdr-ui-portable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Get-ChildItem dist/windows-amd64 | Where-Object { $_.Name -notmatch ' Setup |\.tar\.gz$|\.delta$|^update-' } | Copy-Item -Destination $portable -Recurse
          Compress-Archive -Path "$portable/*" -DestinationPath "artifacts/Hergo-$version-windows-amd64.zip"
          $installers = @(Get-ChildItem dist/windows-amd64/*Setup*.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item $installers[0].FullName "artifacts/Hergo-$version-windows-amd64-setup.exe"
          Get-ChildItem dist/windows-amd64 -File | Where-Object { $_.Name -match '\.tar\.gz$|\.delta$|^update-' } | Copy-Item -Destination artifacts
          if (@(Get-ChildItem artifacts/*.tar.gz -File).Count -eq 0) { throw 'Windows update archive was not produced' }
          $files = @(Get-ChildItem artifacts -File)
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Add-Content "artifacts/Hergo-$version-windows-amd64-SHA256SUMS"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            artifacts/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json
        id: version
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install native GTK and test desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xauth openbox dbus-x11 lsof fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Cache checksum-verified terminal libraries
        uses: actions/cache@v6
        with:
          path: ~/.cache/mygo/natives
          key: mygo-natives-linux-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
      - name: Runtime and release-contract tests
        run: make test
      - name: Build native executables
        run: make build
      - name: Install checksum-pinned official Herdr runtime
        run: python3 scripts/install-herdr-linux.py --arch "${{ matrix.arch }}" --destination "$RUNNER_TEMP/herdr-0.9.5"
      - name: Isolated daemon, PTY and native GTK window integration
        run: |
          # Window-manager geometry and a session bus are needed for desktop
          # behavior; neither this display nor daemon is the user's session.
          # The child shell, not this shell, expands these environment variables.
          # shellcheck disable=SC2016
          xvfb-run -a dbus-run-session -- sh -eu -c '
            openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            export HERDR_UI_M0_WINDOW_BINARY="$PWD/bin/herdr-ui"
            ./scripts/go.sh test -tags integration -count=1 -v -timeout 5m ./integration
          '
      - name: Package native Linux application and signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is required to publish signed updates"
            exit 1
          fi
          ./scripts/go.sh run github.com/egoist/mygo/cmd/mygo build -platform "linux/${{ matrix.arch }}"
          dir="dist/linux-${{ matrix.arch }}"
          version="${{ steps.version.outputs.version }}"
          test -s "$dir/update-linux-${{ matrix.arch }}.json"
          test -s "$dir/hergo-$version-linux-${{ matrix.arch }}.tar.gz"
          test -s "$dir/hergo_${version}_${{ matrix.arch }}.deb"
          # A packaged application must not download its terminal at startup.
          find "$dir" -name 'libghostty-vt.so' -type f -size +0c | grep -q .
          tar -tzf "$dir/hergo-$version-linux-${{ matrix.arch }}.tar.gz" | grep -q 'libghostty-vt.so'
          depends="$(dpkg-deb -f "$dir/hergo_${version}_${{ matrix.arch }}.deb" Depends)"
          case "$depends" in *libgtk-3-0*) ;; *) exit 1 ;; esac
          case "$depends" in *webkit*) echo 'Unexpected WebKit dependency'; exit 1 ;; esac
          sh -n "$dir/install.sh"
      - name: Smoke test packaged terminal without downloading libraries
        run: |
          dir="dist/linux-${{ matrix.arch }}"
          # The executable locates the bundled library, not the developer cache.
          timeout 30s xvfb-run -a dbus-run-session -- "$dir/hergo" -local-fixture -close-after 3s > "$RUNNER_TEMP/linux-package.log" 2>&1
          cat "$RUNNER_TEMP/linux-package.log"
          grep -q 'M0 terminal installed' "$RUNNER_TEMP/linux-package.log"
          grep -q 'M0 terminal closed' "$RUNNER_TEMP/linux-package.log"
      - name: Collect Linux release assets
        run: |
          dir="dist/linux-${{ matrix.arch }}"
          version="${{ steps.version.outputs.version }}"
          mkdir release-assets
          shopt -s nullglob
          cp "$dir"/*.deb "$dir"/*.tar.gz "$dir"/*.delta "$dir"/update-*.json release-assets/
          cp "$dir/install.sh" "release-assets/install-linux-${{ matrix.arch }}.sh"
          cd release-assets
          sha256sum -- * > "Hergo-$version-linux-${{ matrix.arch }}-SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: release-assets/*

  publish:
    needs: [macos, windows, linux]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify all platform assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          test -s "release-assets/Hergo-$version-macos-universal.dmg"
          test -s "release-assets/Hergo-$version-macos-universal.dmg.sha256"
          test -s "release-assets/Hergo-$version-windows-amd64-setup.exe"
          test -s "release-assets/Hergo-$version-windows-amd64.zip"
          test -s "release-assets/Hergo-$version-windows-amd64-SHA256SUMS"
          test -s release-assets/update-darwin-universal.json
          cmp release-assets/update-darwin-universal.json release-assets/update-darwin-arm64.json
          cmp release-assets/update-darwin-universal.json release-assets/update-darwin-amd64.json
          test -s release-assets/update-windows-amd64.json
          for arch in amd64 arm64; do
            test -s "release-assets/hergo_${version}_${arch}.deb"
            test -s "release-assets/hergo-$version-linux-$arch.tar.gz"
            test -s "release-assets/update-linux-$arch.json"
            test -s "release-assets/install-linux-$arch.sh"
          done
          # Both packagers generate the same architecture-detecting installer.
          cmp release-assets/install-linux-amd64.sh release-assets/install-linux-arm64.sh
          cd release-assets
          sha256sum -c "Hergo-$version-macos-universal.dmg.sha256"
          sha256sum -c "Hergo-$version-windows-amd64-SHA256SUMS"
          sha256sum -c "Hergo-$version-linux-amd64-SHA256SUMS"
          sha256sum -c "Hergo-$version-linux-arm64-SHA256SUMS"
          cp install-linux-amd64.sh install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release-assets/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          macOS: the app is signed ad hoc, not with a Developer ID, so Gatekeeper blocks it on first launch. After dragging it to Applications, run:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Hergo.app"
          ```

          Windows x64: use the setup executable or extract the portable ZIP. Physical Windows desktop and IME validation remains outstanding.

          Linux amd64/arm64 (Ubuntu 22.04+): install the matching .deb, or download install.sh and the matching hergo-<version>-linux-<arch>.tar.gz and run `sh install.sh <archive>` as your normal user. GTK 3 is required; WebKitGTK is not. User-local installs support signed in-app updates; .deb installs should be updated with the package manager. Physical X11/Wayland desktop and IME validation remains outstanding.

          Hergo attaches to a running Herdr; install and start Herdr first.
          NOTES
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "Hergo $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
