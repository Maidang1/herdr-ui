name: Windows

on:
  pull_request:
  push:
    branches: ['feat/windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Runtime tests
        run: python scripts/go.py test ./...
      - name: Vet
        run: python scripts/go.py vet ./...
      - name: Build native executable
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python scripts/go.py build -trimpath -o artifacts/herdr-ui.exe ./cmd/herdr-ui
      - name: Install checksum-pinned official Herdr runtime
        run: python scripts/install-herdr-windows.py --destination "$env:RUNNER_TEMP/herdr-0.9.5"
      - name: Real named-pipe daemon and semantic surface integration
        run: python scripts/go.py test -tags integration ./integration -run '^TestWindowsNativeSurface$' -count=1 -v -timeout 3m
      # The pinned mygo CLI has no -skip-installer flag. Its supported build
      # command downloads NSIS when needed and creates the installer on Windows.
      - name: Package native Windows application
        run: python scripts/go.py run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64
      - name: Create portable application ZIP
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'herdr-ui-portable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Get-ChildItem dist/windows-amd64 | Where-Object { $_.Name -notmatch ' Setup |\.tar\.gz$|\.delta$|^update-' } | Copy-Item -Destination $portable -Recurse
          Compress-Archive -Path "$portable/*" -DestinationPath artifacts/herdr-ui-windows-amd64.zip
          $files = @(Get-ChildItem artifacts -File)
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Add-Content artifacts/SHA256SUMS
          }
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-ui-windows-amd64
          if-no-files-found: error
          path: |
            artifacts/*
            dist/windows-amd64/*Setup*.exe
